<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyMusic - La mia Musica</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK (Manteniamo il collegamento cloud) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Header dell'App -->
  <header class="app-header">
    <div class="logo-container">
      <span class="logo-icon">🎵</span>
      <h1 class="app-title">MyMusic</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="openModalBtn">+ Aggiungi Brano</button>
    </div>
  </header>

  <!-- Layout Principale -->
  <div class="main-layout">
    
    <!-- Sidebar Generi -->
    <nav class="sidebar">
      <h2 class="sidebar-title">GENERI</h2>
      <ul class="genre-list">
        <li><button class="nav-btn active" data-genre="all">Tutti i Generi</button></li>
        <li><button class="nav-btn" data-genre="Pop">Pop</button></li>
        <li><button class="nav-btn" data-genre="Rock">Rock</button></li>
        <li><button class="nav-btn" data-genre="Dance">Dance / House</button></li>
        <li><button class="nav-btn" data-genre="Rap / Hip-Hop">Rap / Hip-Hop</button></li>
        <li><button class="nav-btn" data-genre="Italiana">Musica Italiana</button></li>
        <li><button class="nav-btn" data-genre="Classica">Classica</button></li>
        <li><button class="nav-btn" data-genre="Altro">Altro</button></li>
      </ul>
    </nav>

    <!-- Area Contenuto Principale -->
    <main class="content-area">
      
      <!-- Controlli Superiori (Ricerca e Data Management) -->
      <div class="top-controls">
        <input type="text" id="searchInput" placeholder="Cerca per titolo o artista..." class="search-input">
        
        <div class="data-actions">
          <button id="exportJsonBtn" class="btn btn-secondary">Esporta Backup</button>
          <label for="importJsonInput" class="btn btn-secondary">Importa Backup</label>
          <input type="file" id="importJsonInput" accept=".json" style="display:none;">
          <button id="exportExcelBtn" class="btn btn-secondary">Esporta Excel</button>
        </div>
      </div>

      <h2 id="currentGenreTitle" class="section-title">Tutti i Generi</h2>

      <!-- Griglia delle Canzoni -->
      <div id="songsContainer" class="songs-grid">
        <p style="color:#64748b;">Caricamento brani in corso...</p>
      </div>

    </main>

  </div>

  <!-- Modal (Finestra) per Aggiungere / Modificare Brano -->
  <div id="songModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Aggiungi Nuovo Brano</h2>
        <span class="close-btn" id="closeModalBtn">&times;</span>
      </div>
      
      <form id="addSongForm">
        <input type="hidden" id="songId">

        <div class="form-group">
          <label for="artist">Artista *</label>
          <input type="text" id="artist" required placeholder="Es. Alex Baroni">
        </div>

        <div class="form-group">
          <label for="artistPhotoUrl">Link Foto Artista (Dropbox / Web)</label>
          <input type="url" id="artistPhotoUrl" placeholder="https://www.dropbox.com/... o link immagine">
        </div>

        <div class="form-group">
          <label for="title">Titolo Canzone *</label>
          <input type="text" id="title" required placeholder="Es. Cambiare">
        </div>

        <div class="form-group">
          <label for="year">Anno di Uscita</label>
          <input type="number" id="year" placeholder="Es. 1997">
        </div>

        <div class="form-group">
          <label for="genre">Genere Musicale *</label>
          <select id="genre" required>
            <option value="Pop">Pop</option>
            <option value="Rock">Rock</option>
            <option value="Dance">Dance / House</option>
            <option value="Rap / Hip-Hop">Rap / Hip-Hop</option>
            <option value="Italiana">Musica Italiana</option>
            <option value="Classica">Classica</option>
            <option value="Altro">Altro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="youtubeUrl">Link Audio / YouTube / Dropbox *</label>
          <input type="url" id="youtubeUrl" required placeholder="https://www.dropbox.com/... oppure YouTube">
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Salva Brano</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
